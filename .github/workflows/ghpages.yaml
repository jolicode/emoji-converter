
name: Build the public website, and publish to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: castor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The GitHub Actions cache of buildx needs the runtime token and URLs,
      # that only actions get
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build
        run: |
          castor website:build \
            --set "*.cache-from=type=gha" \
            --set "*.cache-to=type=gha,mode=max,ignore-error=true"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
