name: Continuous Integration

'on':
  push:
    branches:
      - main
  pull_request: ~

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version of the website, see website/castor.php
          php-version: '8.5'
          tools: castor

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Check coding standards
        run: castor qa:cs --dry-run

      - name: Run PHPStan
        run: castor qa:phpstan

      - name: Run tests
        run: castor app:tests

  website:
    name: Website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: castor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The GitHub Actions cache of buildx needs the runtime token and URLs,
      # that only actions get
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build
        run: |
          castor app:build \
            --set "*.cache-from=type=gha" \
            --set "*.cache-to=type=gha,mode=max,ignore-error=true"

      # The version php-wasm-builder runs its checks and fetch-files.mjs on
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run tests
        run: castor app:smoke

      - name: Upload the website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  # Only what passes the tests is deployed
  deploy:
    name: Deploy
    needs: [ci, website]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
