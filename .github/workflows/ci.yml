name: Continuous Integration

'on':
  push:
    branches:
      - main
  pull_request: ~

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version of the website, see website/castor.php
          php-version: '8.5'
          tools: castor

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Check coding standards
        run: castor qa:cs --dry-run

      - name: Run PHPStan
        run: castor qa:phpstan

      - name: Run tests
        run: castor app:tests

  website:
    name: Website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: castor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The GitHub Actions cache of buildx needs the runtime token and URLs,
      # that only actions get
      - uses: crazy-max/ghaction-github-runtime@v4

      # Keep in sync with .github/workflows/ghpages.yaml
      - name: Build
        run: |
          castor app:build \
            --set "*.cache-from=type=gha" \
            --set "*.cache-to=type=gha,mode=max,ignore-error=true"

      # The version php-wasm-builder runs its checks and page.mjs on
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run tests
        run: castor app:smoke
